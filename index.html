<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원주 정신건강 도구함</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
  :root{--bg:#f3f3f1;--card:#fff;--line:#d8d8d2;--ink:#1d2327;--mute:#5b6570;--brand:#0f766e;--brand-d:#0b5a54}
  @media (prefers-color-scheme: dark){:root{--bg:#14181a;--card:#1c2224;--line:#344044;--ink:#e8edee;--mute:#9aa7ac;--brand:#2dd4bf;--brand-d:#5eead4;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.55;padding:24px 16px}
  main{max-width:640px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  p.lead{color:var(--mute);margin:0 0 20px;font-size:14px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;color:inherit;text-decoration:none}
  a.card:hover,a.card:focus-visible{border-color:var(--brand);outline:none}
  a.card b{display:block;font-size:18px;color:var(--brand-d)}
  a.card span{color:var(--mute);font-size:14px}
  footer{margin-top:22px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<style>
  #crisisBar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:center;padding:6px 12px;background:#fff4ec;color:#7c2d12;border-bottom:1px solid #f0c9a8;font-size:14px;line-height:1.5}
  #crisisBar a{color:#7c2d12;font-weight:700;text-decoration:underline;white-space:nowrap}
  #crisisBar button{font:inherit;font-size:13px;color:#7c2d12;background:transparent;border:1px solid #d9a77e;border-radius:999px;padding:1px 10px;cursor:pointer}
  @media (prefers-color-scheme: dark){#crisisBar{background:#3a2418;color:#ffd9bd;border-color:#6b4430}#crisisBar a,#crisisBar button{color:#ffd9bd}#crisisBar button{border-color:#8a5a40}}
  @media print{#crisisBar{display:none!important}}
</style>
<div id="crisisBar" role="region" aria-label="위기 연락처">
  <span>위기 시 연락처</span>
  <a href="tel:119">긴급 119</a>
  <a href="tel:112">경찰 112</a>
  <a href="tel:109">자살예방 109</a>
  <a href="tel:15770199">정신건강위기상담 1577-0199</a>
  <span id="crisisBarCenter"></span>
  <button type="button" id="crisisBarEdit">센터 번호 설정</button>
</div>
<script>
(function(){
  var KEY = 'crisisBar.centerPhone', box = document.getElementById('crisisBarCenter');
  function load(){ try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; } }
  function render(){
    var v = load();
    box.textContent = '';
    if (!v) return;
    var a = document.createElement('a');
    a.href = 'tel:' + v.replace(/[^0-9+]/g, '');
    a.textContent = '센터 ' + v;
    box.appendChild(a);
  }
  document.getElementById('crisisBarEdit').onclick = function(){
    var v = window.prompt('우리 센터 대표(위기) 번호를 적어 주세요. 비우면 지웁니다.\n※ 기관 번호만 적고 당사자 정보는 넣지 마세요.', load());
    if (v === null) return;
    try{ if (v.trim()) localStorage.setItem(KEY, v.trim()); else localStorage.removeItem(KEY); }catch(e){}
    render();
  };
  render();
})();
</script>
<main>
  <h1>원주 정신건강 도구함</h1>
  <p class="lead">작업치료사 한 사람이 업무에 쓰는 도구 모음입니다. 서버에 올라가는 내용은 없고, 입력한 내용은 쓰는 브라우저에만 저장됩니다.</p>
  <a class="card" href="recovery_toolbox.html"><b>회복 도구함</b><span>회복 사다리(종이 카드 인쇄)와 위기 대화 가이드</span></a>
  <a class="card" href="resource_map.html"><b>원주 자원 지도</b><span>이동·부담도·사다리 단계로 찾는 자원 목록</span></a>
  <a class="card" href="case_management_on.html"><b>사례관리 ON</b><span>사례관리 기록·점검 (암호화 저장)</span></a>
  <footer>당사자 이름·생년월일 등 개인정보는 회복 도구함과 자원 지도에 넣지 마세요.</footer>
</main>
</body>
</html>
